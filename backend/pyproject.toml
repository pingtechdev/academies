[project]
name = "victory-academy-backend"
version = "0.1.0"
description = "Multi-tenant FastAPI backend for Victory Academy"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
